# Usa o modo de renderização rápido (desativa filtros pesados por padrão)
profile=fast
# Força a aceleração de hardware leve
hwdec=auto-safe
# Renderizador GPU leve
vo=gpu
# Algoritmos de escala ultra-leves para a GPU Intel HD Graphics integrada
scale=bilinear
cscale=bilinear
dscale=bilinear
# Sincronização de vídeo otimizada para menor uso de CPU
video-sync=audio
# Aumenta o cache em RAM para evitar pequenos engasgos
cache=yes
demuxer-max-bytes=100MiB
demuxer-max-back-bytes=50MiB
# Força o YouTube/yt-dlp a priorizar H.264 (codec leve em 1080p aceito via HW pelo J1800)
ytdl-format="bestvideo[height<=1080][vcodec^=avc1]+bestaudio/best"
# Ativa a decodificação por hardware (auto-detecção)
save-position-on-quit
# Inicia em tela cheia
fullscreen=yes
# Define o nível do OSD (On-Screen Display)
osd-level=1
# Prioridade de idiomas de áudio (Português, Inglês)
alang=pt,por,en,eng
# Prioridade de idiomas de legenda (Português, Inglês)
slang=pt,por,en,eng

# --profile=
[720p60]
ytdl-format=bestvideo[height<=720][fps<=60]+bestaudio/best

[1080p30]
ytdl-format=bestvideo[height<=1080][fps<=30]+bestaudio/best

[1080p60]
ytdl-format=bestvideo[height<=1080][fps<=60]+bestaudio/best

[cinema]
profile=high-quality
vo=gpu-next
scale=ewa_lanczos
cscale=ewa_lanczos
dscale=mitchell
