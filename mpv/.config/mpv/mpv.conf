# ==============================================================================
# CONFIGURAÇÃO PADRÃO (Default para Celeron J1800)
# ==============================================================================
# Perfis de velocidade e renderizador leve para a GPU Intel Bay Trail
profile=fast
hwdec=auto-safe
vo=gpu

# Algoritmos de escala ultra-leves (menor uso de GPU)
scale=bilinear
cscale=bilinear
dscale=bilinear

# Otimização de áudio, sincronização e cache
video-sync=audio
cache=yes
demuxer-max-bytes=100MiB
demuxer-max-back-bytes=50MiB

# Padrão seguro para o J1800: Limita em 720p H.264 (AVC) para rodar sem travamentos
ytdl-format="bestvideo[height<=720][vcodec^=avc1]+bestaudio/best"

# Geral
save-position-on-quit=yes
fullscreen=yes
osd-level=1

# Idiomas
alang=pt,por,en,eng
slang=pt,por,en,eng


# ==============================================================================
# PRESETS DE DESEMPENHO E QUALIDADE
# Uso no terminal/lançador: mpv --profile=NOME_DO_PRESET <arquivo/URL>
# ==============================================================================

[low-720p]
profile=fast
hwdec=auto-safe
vo=gpu
scale=bilinear
cscale=bilinear
dscale=bilinear
ytdl-format="bestvideo[height<=720][vcodec^=avc1]+bestaudio/best"

[low-1080p]
profile=fast
hwdec=auto-safe
vo=gpu
scale=bilinear
cscale=bilinear
dscale=bilinear
ytdl-format="bestvideo[height<=1080][fps<=30][vcodec^=avc1]+bestaudio/best"

[high-1080p]
profile=high-quality
hwdec=auto-safe
vo=gpu-next
scale=ewa_lanczos
cscale=ewa_lanczos
dscale=mitchell
ytdl-format="bestvideo[height<=1080][fps<=60]+bestaudio/best"

[best]
profile=high-quality
hwdec=auto-safe
vo=gpu-next
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell
dither-depth=auto
correct-downscaling=yes
cscale-antiring=0.7
dscale-antiring=0.7
ytdl-format="bestvideo+bestaudio/best"